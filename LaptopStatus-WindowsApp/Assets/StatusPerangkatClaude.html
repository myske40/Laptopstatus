window.laptopStatusUpdate=(x)=>{if(!x)return;v.cpu=x.cpu;v.ram=x.ram;if(x.battery>=0)v.bat=x.battery;hist.cpu.push(v.cpu);hist.ram.push(v.ram);hist.cpu=hist.cpu.slice(-30);hist.ram=hist.ram.slice(-30);live()};

window.laptopStatusSetState=(x)=>{deviceState=x||{};const set=(id,value)=>{const e=$(id);if(e)e.textContent=value||'—'};set('#local-address',deviceState.address);set('#local-address-summary',deviceState.address);set('#pair-key',deviceState.pairingKey);set('#pair-key-summary',deviceState.pairingKey);set('#tls-fingerprint',deviceState.fingerprint);set('#tunnel-status',deviceState.tunnelStatus);set('#device-ram',deviceState.memory);set('#device-disk',deviceState.disk);set('#device-os',deviceState.os);set('#device-battery',deviceState.batteryText);set('#device-architecture',deviceState.architecture);set('#device-threads',deviceState.logicalProcessors);set('#device-cpu-temp',deviceState.cpuTemperature);set('#device-fan',deviceState.fanSpeed);renderDeviceHardware(deviceState);set('#gpu-usage',deviceState.gpuUsage);set('#troubleshooting',deviceState.troubleshooting);set('#cfs',deviceState.tunnelStatus);if($('#cfb'))$('#cfb').textContent=deviceState.tunnelActive?'Putuskan Cloudflare':'Sambungkan lewat Cloudflare';if($('#status-pill'))$('#status-pill').innerHTML=`<b></b>${deviceState.serviceStatus||'LAYANAN AKTIF'}`;[['anim','animations'],['claude','claudeStyle'],['s1','automaticDualRoute'],['s2','chimes'],['s3','androidJoke'],['s4','screenAccessEnabled']].forEach(([id,key])=>{const e=$('#'+id);if(e&&typeof deviceState[key]=='boolean')e.checked=deviceState[key]});if($('#jm')&&deviceState.jokeMessage)$('#jm').value=deviceState.jokeMessage;if($('#jh')&&deviceState.jokeColor){$('#jh').value=deviceState.jokeColor;$('#jp').style.background=deviceState.jokeColor}if($('#ja')&&Number.isInteger(deviceState.jokeAnimation))$('#ja').selectedIndex=deviceState.jokeAnimation};

function tbl(){const root=$('#pt');if(!root)return;const q=(($('#ps')||{}).value||'').trim().toLocaleLowerCase();const filtered=procs.filter(p=>(p.name+' '+p.pid).toLocaleLowerCase().includes(q));const counts={all:procs.length,kill:procs.filter(p=>p.canTerminate).length,safe:procs.filter(p=>!p.canTerminate).length};Object.entries(counts).forEach(([k,n])=>{const e=$(`#proc-count-${k}`);if(e)e.textContent=n});$$('[data-proc-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.procFilter===procFilter)));const rows=filtered.filter(p=>procFilter==='kill'?p.canTerminate:procFilter==='safe'?!p.canTerminate:true).sort((a,b)=>procSort==='ram'?Number(b.memory)-Number(a.memory)||a.name.localeCompare(b.name):a.name.localeCompare(b.name)||Number(b.memory)-Number(a.memory));const status=$('#proc-status');if(status)status.textContent=`${rows.length} dari ${procs.length} proses · ${counts.kill} bisa dihentikan · ${counts.safe} dilindungi`;root.replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='proc-empty';empty.textContent=procs.length?'Tidak ada proses yang cocok. Ubah pencarian atau filter.':'Belum ada proses. Tekan Perbarui data.';root.append(empty);return}rows.forEach(p=>{const row=document.createElement('article');row.className='proc-row';row.dataset.pid=String(p.pid);const main=document.createElement('div');main.className='proc-main';const icon=document.createElement('div');icon.className='proc-icon';icon.setAttribute('aria-hidden','true');if(p.iconBase64&&/^[A-Za-z0-9+/]+=*$/.test(p.iconBase64)){const img=document.createElement('img');img.src=`data:image/png;base64,${p.iconBase64}`;img.alt='';img.onerror=()=>{img.remove();icon.textContent=(p.name||'?').trim().charAt(0).toLocaleUpperCase()||'?'};icon.append(img)}else icon.textContent=(p.name||'?').trim().charAt(0).toLocaleUpperCase()||'?';const info=document.createElement('div');info.className='proc-info';const name=document.createElement('span');name.className='proc-name';name.textContent=p.name;const meta=document.createElement('div');meta.className='proc-meta';meta.textContent=`PID ${p.pid}`;const badge=document.createElement('span');badge.className=`proc-badge${p.canTerminate?'':' locked'}`;badge.textContent=p.canTerminate?'Bisa dihentikan':'Dilindungi';meta.append(badge);info.append(name,meta);const side=document.createElement('div');side.className='proc-side';const ram=document.createElement('span');ram.className='proc-ram';ram.textContent=`${Math.round(Number(p.memory)||0)} MB`;const action=document.createElement('button');action.type='button';action.className=`btn sm proc-action ${p.canTerminate?'dng':'sec'}`;action.dataset.procAction=p.canTerminate?'kill':'reason';action.textContent=p.canTerminate?'Hentikan':'Dilindungi';action.disabled=!p.canTerminate;if(!p.canTerminate)action.title=p.note||'Proses inti atau dilindungi Windows';side.append(ram,action);main.append(icon,info,side);row.append(main);if(!p.canTerminate&&p.note){const note=document.createElement('p');note.className='proc-note';note.textContent=p.note;row.append(note)}root.append(row)})}
