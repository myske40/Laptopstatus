<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LaptopStatus — kendali laptop dari Android</title>
  <desc id="desc">Banner gelap dengan ilustrasi laptop dan ponsel yang terhubung, serta dukungan Windows dan Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#142638"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65e7c4"/><stop offset="1" stop-color="#28b997"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b3d"/><stop offset="1" stop-color="#0b1623"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="895" cy="180" r="128" fill="#38d4b0" opacity=".11" filter="url(#glow)"/>
  <path d="M40 300h1120" stroke="#274153" stroke-width="1" opacity=".65"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="64" y="64" width="48" height="48" rx="14" fill="url(#mint)"/>
    <path d="M75 78h26v18H75zm8 22h10m-5-4v4" fill="none" stroke="#09202a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="99" fill="#eaf5f4" font-size="23" font-weight="700">LaptopStatus</text>
    <text x="64" y="174" fill="#f4f8fb" font-size="42" font-weight="700">Laptop di tanganmu.</text>
    <text x="64" y="219" fill="#c2d1dc" font-size="20">Pantau status, proses, daya, dan terminal dari Android.</text>
    <g font-size="13" font-weight="700" letter-spacing="1.1">
      <rect x="64" y="253" width="116" height="36" rx="18" fill="#173244"/><text x="122" y="276" fill="#71e4c6" text-anchor="middle">WINDOWS</text>
      <rect x="191" y="253" width="106" height="36" rx="18" fill="#173244"/><text x="244" y="276" fill="#71e4c6" text-anchor="middle">ANDROID</text>
      <rect x="308" y="253" width="84" height="36" rx="18" fill="#173244"/><text x="350" y="276" fill="#71e4c6" text-anchor="middle">LINUX</text>
    </g>
    <g transform="translate(620 55)">
      <rect x="28" y="22" width="350" height="218" rx="17" fill="#07101a" stroke="#355063" stroke-width="2"/>
      <rect x="42" y="36" width="322" height="188" rx="10" fill="url(#screen)"/>
      <circle cx="61" cy="55" r="4" fill="#70e5c7"/><text x="76" y="60" fill="#d9e7ed" font-size="12" font-weight="600">LAPTOPSTATUS  /  RINGKASAN</text>
      <rect x="60" y="79" width="132" height="56" rx="10" fill="#142a3b"/><text x="74" y="100" fill="#8da4b3" font-size="10">CPU</text><text x="74" y="123" fill="#f1faf8" font-size="21" font-weight="700">24%</text>
      <rect x="204" y="79" width="142" height="56" rx="10" fill="#142a3b"/><text x="218" y="100" fill="#8da4b3" font-size="10">MEMORI</text><text x="218" y="123" fill="#f1faf8" font-size="21" font-weight="700">6.8 GB</text>
      <rect x="60" y="147" width="286" height="58" rx="10" fill="#102333"/>
      <path d="M75 188c24-29 39 4 62-18s34-1 56-16 37 12 56-3 39 9 79-16" fill="none" stroke="url(#mint)" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 241h406l-23 16H24z" fill="#8296a3"/><path d="M168 242h72l-8 7h-56z" fill="#536b7b"/>
      <g transform="translate(310 100)">
        <rect x="0" y="0" width="112" height="196" rx="22" fill="#050b12" stroke="#87a1ad" stroke-width="2"/>
        <rect x="8" y="13" width="96" height="170" rx="15" fill="#0e1a27"/>
        <rect x="39" y="7" width="34" height="4" rx="2" fill="#617784"/>
        <circle cx="56" cy="43" r="14" fill="url(#mint)"/><path d="M48 43l6 6 11-13" fill="none" stroke="#08212a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="76" fill="#edf8f6" font-size="11" font-weight="700" text-anchor="middle">Terhubung</text>
        <rect x="20" y="91" width="72" height="23" rx="7" fill="#183144"/><text x="56" y="106" fill="#b9ced8" font-size="8" text-anchor="middle">CPU    RAM    DAYA</text>
        <rect x="20" y="121" width="72" height="23" rx="7" fill="#183144"/><text x="56" y="136" fill="#b9ced8" font-size="8" text-anchor="middle">PROSES</text>
        <rect x="20" y="151" width="72" height="20" rx="7" fill="#173f3d"/><text x="56" y="164" fill="#71e4c6" font-size="8" text-anchor="middle">KENDALI DAYA</text>
      </g>
    </g>
  </g>
</svg>
